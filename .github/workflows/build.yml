name: Build Debug APK

on:
  push:
    branches: [ "main", "chore/english-only", "feat/password-vault", "feature/push-update", "rename-wip", "cleanup-wip", "router-wip", "router-b", "router-c", "router-wire", "router-app", "router-fix", "capsule-live", "smart-picker", "zh-cleanup", "zh-cleanup-2", "image-gen", "auto-update", "fix-rankings-pipeline", "feat/smart-router-auto" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Core Tests
        run: ./gradlew :core:test

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: FCM Payload Dry-Run Validation
        run: |
          TAG="v0.1.48-${{ github.run_number }}"
          VERSION="0.1.48"
          python3 -c "
          import json
          payload = {
              'validate_only': True,
              'message': {
                  'topic': 'harness-releases',
                  'data': {
                      'version': '$VERSION',
                      'tag': '$TAG'
                  }
              }
          }
          assert 'notification' not in payload['message'], 'FCM message must not have notification block'
          assert payload['message']['topic'] == 'harness-releases'
          print('FCM payload dry-run validation passed!')
          "

      - name: Run App Unit Tests
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew testDebugUnitTest

  apk:
    needs: [core-tests, app-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Setup Fixed Debug Keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 || secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Harness-Agent-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION_NAME}-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --title "Harness Agent $TAG" \
            --generate-notes
