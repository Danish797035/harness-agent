name: Regenerate prompt goldens (temporary)

on:
  push:
    branches: [ "fix/audit-top-fixes" ]
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Regenerate goldens
        run: ./gradlew :core:test -PupdateSnapshots
        continue-on-error: true

      - name: Upload regenerated goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: |
            core/src/test/resources/loop-snapshots
            core/src/test/resources/prompt-surface
            core/src/test/resources/prompts/golden
          if-no-files-found: error
