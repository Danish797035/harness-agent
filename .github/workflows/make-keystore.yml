name: Generate Fixed Debug Keystore

on:
  workflow_dispatch:

jobs:
  make-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore harness-debug.jks \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-debug-keystore
          path: harness-debug.jks
