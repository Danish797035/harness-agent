org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official
# Do not uninstall the App after the real device test: uninstalling will lose the wireless debugging
# pairing (the key is stored in the App) and accessibility authorization, and you will have to pair it
# again every time
android.injected.androidTest.leaveApksInstalledAfterRun=true
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
